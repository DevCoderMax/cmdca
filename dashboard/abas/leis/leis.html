<!-- Conteúdo da aba de leis -->
<div class="table-container">
    <div class="table-header">
        <h2>Lista de Leis</h2>
        <button class="btn btn-primary" id="addLeiBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Nova Lei
        </button>
    </div>
    <table class="data-table">
        <thead>
            <tr>
                <th>Número</th>
                <th>Título</th>
                <th>Abrangência</th>
                <th>Data</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <!-- O conteúdo da tabela será preenchido dinamicamente -->
        </tbody>
    </table>
</div>

<!-- Modal de Edição de Lei -->
<div class="modal" id="leiModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Editar Lei</h2>
            <button class="close-modal">×</button>
        </div>
        <form id="leiForm">
            <input type="hidden" id="leiId">
            <div class="form-group">
                <label for="numero">Número</label>
                <input type="text" id="numero" name="numero" required>
            </div>
            <div class="form-group">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" required>
            </div>
            <div class="form-group">
                <label for="abrangencia">Abrangência</label>
                <input type="text" id="abrangencia" name="abrangencia" required>
            </div>
            <div class="form-group">
                <label for="data">Data</label>
                <input type="date" id="data" name="data" required>
            </div>
            <div class="form-group">
                <label for="link">Link Externo</label>
                <input type="url" id="link" name="link">
            </div>
            <div class="form-group">
                <label for="arquivo">Link do Arquivo (PDF)</label>
                <input type="url" id="arquivo" name="arquivo">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary close-modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>
