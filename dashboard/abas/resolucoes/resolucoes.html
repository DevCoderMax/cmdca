
<!-- Conteúdo da aba de resoluções -->
<div class="table-container">
    <div class="table-header">
        <h2>Lista de Resoluções</h2>
        <button class="btn btn-primary" id="addResolucaoBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Nova Resolução
        </button>
    </div>
    <table class="data-table">
        <thead>
            <tr>
                <th>Título</th>
                <th>Tipo de Conselho</th>
                <th>Data</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <!-- O conteúdo da tabela será preenchido dinamicamente -->
        </tbody>
    </table>
</div>

<!-- Modal de Edição de Resolução -->
<div class="modal" id="resolucaoModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Editar Resolução</h2>
            <button class="close-modal">×</button>
        </div>
        <form id="resolucaoForm">
            <input type="hidden" id="resolucaoId">
            <div class="form-group">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" required>
            </div>
            <div class="form-group">
                <label for="tipo_conselho">Tipo de Conselho</label>
                <input type="text" id="tipo_conselho" name="tipo_conselho" required>
            </div>
            <div class="form-group">
                <label for="data_resolucao">Data</label>
                <input type="date" id="data_resolucao" name="data_resolucao" required>
            </div>
            <div class="form-group">
                <label for="link_resolucao">Link da Resolução (PDF)</label>
                <input type="url" id="link_resolucao" name="link_resolucao">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary close-modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>
