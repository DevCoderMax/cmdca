<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMDCA Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <button class="theme-toggle" aria-label="Alternar tema">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="display: none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span>Tema</span>
    </button>
    <div class="dashboard">
        <header class="header">
            <h1>CMDCA Dashboard</h1>
        </header>
        
        <nav class="tab-navigation">
            <button class="tab-button active" data-tab="leis">Leis</button>
            <button class="tab-button" data-tab="atas">Atas</button>
            <button class="tab-button" data-tab="resolucoes">Resoluções</button>
        </nav>

        <main class="content">
            <section id="leis" class="tab-content active">
                <div class="table-container">
                    <div class="table-header">
                        <h2>Lista de Leis</h2>
                        <button id="addLeiBtn" class="add-button">
                            <span>+</span> Adicionar Lei
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table id="leisTable" class="modern-table">
                            <thead>
                                <tr>
                                    <th>Título</th>
                                    <th>Número</th>
                                    <th>Abrangência</th>
                                    <th>Data</th>
                                    <th>Link</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Dados serão inseridos aqui dinamicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Modal de Edição -->
                <div id="editModal" class="modal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2>Editar Lei</h2>
                            <button class="modal-close">&times;</button>
                        </div>
                        <form id="editForm">
                            <input type="hidden" id="editId">
                            <div class="form-group">
                                <label for="editTitulo">Título</label>
                                <input type="text" id="editTitulo" required>
                            </div>
                            <div class="form-group">
                                <label for="editNumero">Número</label>
                                <input type="text" id="editNumero" required>
                            </div>
                            <div class="form-group">
                                <label for="editAbrangencia">Abrangência</label>
                                <input type="text" id="editAbrangencia" required>
                            </div>
                            <div class="form-group">
                                <label for="editData">Data</label>
                                <input type="date" id="editData" required>
                            </div>
                            <div class="form-group">
                                <label for="editLink">Link</label>
                                <input type="url" id="editLink">
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn-cancel">Cancelar</button>
                                <button type="submit" class="btn-save">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
            
            <section id="atas" class="tab-content">
                <!-- O conteúdo será carregado dinamicamente -->
            </section>
            
            <section id="resolucoes" class="tab-content">
                <div class="card-container">
                    <!-- Conteúdo dinâmico das resoluções será inserido aqui -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal de Adicionar Lei -->
    <div id="addLeiModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Adicionar Nova Lei</h2>
                <button class="modal-close">&times;</button>
            </div>
            <form id="addLeiForm">
                <div class="form-group">
                    <label for="addTitulo">Título</label>
                    <input type="text" id="addTitulo" required>
                </div>
                <div class="form-group">
                    <label for="addNumero">Número</label>
                    <input type="text" id="addNumero" required>
                </div>
                <div class="form-group">
                    <label for="addAbrangencia">Abrangência</label>
                    <input type="text" id="addAbrangencia" required>
                </div>
                <div class="form-group">
                    <label for="addData">Data</label>
                    <input type="date" id="addData" required>
                </div>
                <div class="form-group">
                    <label for="addLink">Link</label>
                    <input type="url" id="addLink">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel">Cancelar</button>
                    <button type="submit" class="btn-save">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js" type="module"></script>
</body>
</html>
